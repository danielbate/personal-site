name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass > /dev/null
      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ vars.IONOS_SSH_HOST }}
          SSH_USER: ${{ vars.IONOS_SSH_USER }}
          SSH_PORT: ${{ vars.IONOS_SSH_PORT }}
          SSH_PATH: ${{ vars.IONOS_SSH_PATH }}
          SSH_PASS: ${{ secrets.IONOS_SSH_PASS }}
        run: chmod +x scripts/deploy.sh && ./scripts/deploy.sh
